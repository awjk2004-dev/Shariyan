<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة شريان</title><link rel="stylesheet" href="css/style.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="index.html">شريان<span>.</span></a><nav class="nav"><a href="index.html">الرئيسية</a><a href="dashboard.html">لوحة التحكم</a><a href="#" data-logout>خروج</a></nav></header><main class="section"><div class="eyebrow">إدارة المنصة</div><h1>المستخدمون والطلبات</h1><p class="muted">يمكن للأدمن تعديل ولاية أو حي المستخدم وتحديث حالات الطلبات.</p><div data-message></div><section><h2>المستخدمون والولايات</h2><div class="grid" id="users"></div></section><section class="section" id="requests"><h2>الطلبات</h2><div class="grid" id="requests-list"></div></section></main></div><script src="js/app.js"></script><script>requireAuth();const cities=['كسلا','المربعات الشعبي','المرغني','مكرم','حي العرب','سكة حديد','حي العمال','حي النور','حي السلام','حي الضباط'];async function load(){try{const [users,items]=await Promise.all([api('/admin/users'),api('/admin/requests')]);document.querySelector('#users').innerHTML=users.map(u=>`<article class="card"><h3>${u.full_name}</h3><p class="muted">${u.email}</p><div class="field"><label for="city-${u.id}">الولاية / الحي</label><select id="city-${u.id}">${cities.map(city=>`<option ${city===u.city?'selected':''}>${city}</option>`).join('')}</select></div><div class="actions"><button class="button secondary" onclick="saveCity(${u.id})">حفظ الولاية</button>${u.is_admin?'<span class="eyebrow">أدمن</span>':''}<button class="button ghost" onclick="removeUser(${u.id})">حذف المستخدم</button></div></article>`).join('')||'<p class="muted">لا يوجد مستخدمون.</p>';document.querySelector('#requests-list').innerHTML=items.map(r=>`<article class="card"><div class="eyebrow">${r.blood_type} · ${r.status}</div><h3>${r.patient_name}</h3><p class="muted">${r.city} · ${r.hospital}</p><button class="button secondary" onclick="closeRequest(${r.id})">إغلاق الطلب</button></article>`).join('')||'<p class="muted">لا توجد طلبات.</p>'}catch(e){showMessage(e.message,true)}}async function saveCity(id){try{await api('/admin/users/'+id+'/city',{method:'PATCH',body:JSON.stringify({city:document.querySelector('#city-'+id).value})});showMessage('تم تحديث الولاية بنجاح')}catch(e){showMessage(e.message,true)}}async function removeUser(id){if(confirm('تأكيد حذف المستخدم؟')){await api('/admin/users/'+id,{method:'DELETE'});load()}}async function closeRequest(id){await api('/admin/requests/'+id+'/status?status=fulfilled',{method:'PATCH'});load()}load()</script></body></html>
