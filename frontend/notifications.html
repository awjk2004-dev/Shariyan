<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإشعارات | شريان</title><link rel="stylesheet" href="css/style.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="index.html">شريان<span>.</span></a><nav class="nav" data-nav><a href="requests.html">الطلبات</a></nav></header><main class="section"><div class="eyebrow">تنبيهاتك</div><h1>الإشعارات</h1><div class="grid" id="list"></div></main></div><script src="js/app.js"></script><script>requireAuth();async function load(){const rows=await api('/notifications');list.innerHTML=rows.length?rows.map(n=>`<article class="card"><div class="eyebrow">${n.read_at?'مقروء':'جديد'}</div><h3>${n.title}</h3><p>${n.body}</p>${n.link?`<a class="button ghost" href="${n.link}">فتح</a>`:''}${!n.read_at?`<button class="button secondary" onclick="readNotification(${n.id})">تحديد كمقروء</button>`:''}</article>`).join(''):'<p class="muted">لا توجد إشعارات جديدة.</p>'}async function readNotification(id){await api('/notifications/'+id+'/read',{method:'PATCH'});load()}load()</script></body></html>
