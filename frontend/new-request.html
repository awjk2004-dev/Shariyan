<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب دم جديد | شريان</title><link rel="stylesheet" href="css/style.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="index.html">شريان<span>.</span></a><nav class="nav"><a href="requests.html">الطلبات</a><a href="#" data-logout>خروج</a></nav></header><main class="form-wrap"><form class="form-card" id="request-form"><h1>إنشاء طلب دم</h1><p class="muted">أدخل التفاصيل الأساسية ليصل طلبك إلى المتبرعين القريبين.</p><div data-message></div><div class="field"><label>اسم المريض</label><input name="patient_name" required minlength="2"></div><div class="field"><label>فصيلة الدم</label><select name="blood_type" required><option value="">اختر الفصيلة</option><option>O+</option><option>O-</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option></select></div><div class="field"><label>الولاية / الحي</label><select name="city" required><option value="">اختر الولاية أو الحي</option><option value="كسلا" selected>ولاية كسلا</option><option value="المربعات الشعبي">المربعات الشعبي</option><option value="المرغني">المرغني</option><option value="مكرم">مكرم</option><option value="حي العرب">حي العرب</option><option value="سكة حديد">سكة حديد</option><option value="حي العمال">حي العمال</option><option value="حي النور">حي النور</option><option value="حي السلام">حي السلام</option><option value="حي الضباط">حي الضباط</option></select></div><div class="field"><label>المستشفى</label><input name="hospital" required></div><div class="field"><label>عدد الوحدات</label><input name="units" type="number" min="1" max="20" value="1" required></div><div class="field"><label>ملاحظات</label><textarea name="notes" maxlength="1000"></textarea></div><label><input name="urgent" type="checkbox" checked> الطلب عاجل</label><div class="actions"><button class="button" type="submit">نشر الطلب</button><a class="button ghost" href="requests.html">إلغاء</a></div></form></main></div><script src="js/config.js?v=deployment-20261117"></script><script src="js/app.js?v=brand-20261117-v2"></script><script>requireAuth();document.querySelector('#request-form').addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.units=Number(data.units);data.urgent=Boolean(data.urgent);try{await api('/requests',{method:'POST',body:JSON.stringify(data)});location.href='requests.html'}catch(err){showMessage(err.message,true)}})</script></body></html>
