<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محادثة | شريان</title><link rel="stylesheet" href="css/style.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="index.html">شريان<span>.</span></a><nav class="nav"><a href="donors.html">المتبرعون</a><a href="#" data-logout>خروج</a></nav></header><main class="form-wrap"><section class="form-card"><h1>تواصل بأمان</h1><div id="thread"></div><div data-message></div><form id="message-form"><div class="field"><label>رسالتك</label><textarea name="content" required maxlength="2000"></textarea></div><button class="button" type="submit">إرسال الرسالة</button></form></section></main></div><script src="js/app.js"></script><script>requireAuth();const recipient=Number(new URLSearchParams(location.search).get('recipient'));async function load(){try{const messages=await api('/messages/'+recipient);thread.innerHTML=messages.map(m=>`<p class="card"><strong>${m.sender_id===recipient?'المتبرع':'أنت'}:</strong> ${m.content}</p>`).join('')||'<p class="muted">ابدأ المحادثة برسالة واضحة ومحترمة.</p>'}catch(e){showMessage(e.message,true)}}document.querySelector('#message-form').addEventListener('submit',async e=>{e.preventDefault();const content=new FormData(e.target).get('content');try{await api('/messages',{method:'POST',body:JSON.stringify({recipient_id:recipient,content})});e.target.reset();load()}catch(err){showMessage(err.message,true)}});load()</script></body></html>
