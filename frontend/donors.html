<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المتبرعون | شريان</title><link rel="stylesheet" href="css/style.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="index.html">شريان<span>.</span></a><nav class="nav" data-nav><a href="requests.html">طلبات الدم</a><a href="register.html">سجّل كمتبرع</a></nav></header><main class="section"><div class="section-heading"><div><div class="eyebrow">دليل المتبرعين</div><h1>المتبرعون في ولاية كسلا</h1></div></div><div class="toolbar"><select id="blood"><option value="">كل الفصائل</option><option>O+</option><option>O-</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option></select><input id="city" placeholder="مثال: كسلا، المربعات الشعبي، المرغني، حي العرب، سكة حديد"><button class="button" id="search">بحث</button></div><div class="grid" id="list"></div></main></div><script src="js/app.js"></script><script>async function load(){const q=new URLSearchParams();if(blood.value)q.set('blood_type',blood.value);if(city.value)q.set('city',city.value);try{const rows=await api('/donors?'+q);list.innerHTML=rows.length?rows.map(d=>`<article class="card"><div class="eyebrow">فصيلة ${d.blood_type}</div><h3>${d.user.full_name}</h3><p class="muted">الحي: ${d.user.city}</p><a class="button secondary" href="message.html?recipient=${d.user.id}">ابدأ محادثة</a></article>`).join(''):'<p class="muted">لا توجد نتائج مطابقة حاليًا.</p>'}catch(e){list.innerHTML='<p class="muted">تعذر تحميل المتبرعين في الوقت الحالي.</p>'}}document.querySelector('#search').onclick=load;load()</script></body></html>
