<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | شريان</title><link rel="stylesheet" href="css/style.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="index.html">شريان<span>.</span></a></header><main class="form-wrap"><form class="form-card" id="login-form"><h1>مرحبًا بعودتك</h1><p class="muted">سجّل الدخول لمتابعة التبرعات والطلبات.</p><div data-message></div><div class="field"><label>البريد الإلكتروني</label><input name="email" type="email" required></div><div class="field"><label>كلمة المرور</label><input name="password" type="password" minlength="8" required></div><div class="actions" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;"><button class="button" type="submit">دخول</button><a class="button ghost" href="index.html">رجوع</a></div><p class="muted">ليس لديك حساب؟ <a href="register.html">أنشئ حسابًا</a></p></form></main></div><script src="js/config.js?v=deployment-20261117"></script><script src="js/app.js?v=brand-20261117-v2"></script><script>document.querySelector('#login-form').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{const d=await api('/auth/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({username:f.get('email'),password:f.get('password')})});localStorage.setItem('shريان_token',d.access_token);location.href='donors.html'}catch(err){showMessage(err.message,true)}})</script></body></html>
