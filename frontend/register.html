<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب جديد | شريان</title><link rel="stylesheet" href="css/style.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="index.html">شريان<span>.</span></a></header><main class="form-wrap"><form class="form-card" id="register-form"><h1>انضم إلى شريان</h1><div data-message></div><div class="field"><label>الاسم الكامل</label><input name="full_name" required minlength="2"></div><div class="field"><label>البريد الإلكتروني</label><input name="email" type="email" required></div><div class="field"><label>كلمة المرور</label><input name="password" type="password" required minlength="8"></div><div class="field"><label>رقم الجوال</label><input name="phone" required minlength="7"></div><div class="field"><label>الولاية / الحي</label><select name="city" required><option value="">اختر الولاية أو الحي</option><option value="كسلا" selected>ولاية كسلا</option><option value="المربعات الشعبي">المربعات الشعبي</option><option value="المرغني">المرغني</option><option value="مكرم">مكرم</option><option value="حي العرب">حي العرب</option><option value="سكة حديد">سكة حديد</option><option value="حي العمال">حي العمال</option><option value="حي النور">حي النور</option><option value="حي السلام">حي السلام</option><option value="حي الضباط">حي الضباط</option></select></div><div class="actions" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;"><button class="button" type="submit">إنشاء الحساب</button><a class="button ghost" href="login.html">رجوع</a></div></form></main></div><script src="js/config.js?v=deployment-20261117"></script><script src="js/app.js?v=brand-20261117-v2"></script><script>document.querySelector('#register-form').addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{await api('/auth/register',{method:'POST',body:JSON.stringify(data)});showMessage('تم إنشاء الحساب. يمكنك تسجيل الدخول الآن.');setTimeout(()=>location.href='login.html',700)}catch(err){showMessage(err.message,true)}})</script></body></html>
