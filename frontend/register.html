<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب جديد | شريان</title><link rel="stylesheet" href="css/style.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="index.html">شريان<span>.</span></a></header><main class="form-wrap"><form class="form-card" id="register-form"><h1 id="form-title">انضم إلى شريان</h1><div data-message></div><div class="field" data-account-field><label>الاسم الكامل</label><input name="full_name" required minlength="2"></div><div class="field" data-account-field><label>البريد الإلكتروني</label><input name="email" type="email" required></div><div class="field" data-account-field><label>كلمة المرور</label><input name="password" type="password" required minlength="8"></div><div class="field" data-account-field><label>رقم الجوال</label><input name="phone" required minlength="7"></div><div class="field" data-account-field><label>الولاية / الحي</label><select name="city" required><option value="">اختر الولاية أو الحي</option><option value="كسلا" selected>ولاية كسلا</option><option value="المربعات الشعبي">المربعات الشعبي</option><option value="المرغني">المرغني</option><option value="مكرم">مكرم</option><option value="حي العرب">حي العرب</option><option value="سكة حديد">سكة حديد</option><option value="حي العمال">حي العمال</option><option value="حي النور">حي النور</option><option value="حي السلام">حي السلام</option><option value="حي الضباط">حي الضباط</option></select></div><div class="field"><label for="blood-type">زمرة الدم</label><select id="blood-type" name="blood_type" required><option value="">اختر زمرة الدم</option><option value="A+">A+</option><option value="A-">A-</option><option value="B+">B+</option><option value="B-">B-</option><option value="AB+">AB+</option><option value="AB-">AB-</option><option value="O+">O+</option><option value="O-">O-</option></select></div><div class="actions" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;"><button class="button" type="submit">إنشاء الحساب</button><a class="button ghost" href="login.html">رجوع</a></div></form></main></div><script src="js/config.js?v=deployment-20261117"></script><script src="js/app.js?v=brand-20261117-v2"></script><script>const registerForm=document.querySelector('#register-form');const bloodTypeField=document.querySelector('#blood-type');const registerButton=registerForm.querySelector('button[type="submit"]');let donorEditMode=Boolean(token());if(donorEditMode){document.querySelector('#form-title').textContent='بيانات التبرع';document.querySelectorAll('[data-account-field]').forEach(field=>{field.hidden=true;field.querySelector('input,select').disabled=true});registerButton.textContent='حفظ بيانات التبرع';api('/donors/me').then(donor=>{if(donor){bloodTypeField.value=donor.blood_type;document.querySelector('#form-title').textContent='تحديث بيانات التبرع'}}).catch(error=>showMessage(error.message,true))}registerForm.addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{if(donorEditMode){await api('/donors/me',{method:'POST',body:JSON.stringify({blood_type:data.blood_type})});showMessage('تم حفظ بيانات التبرع.');setTimeout(()=>location.href='index.html',700)}else{await api('/auth/register',{method:'POST',body:JSON.stringify(data)});showMessage('تم إنشاء الحساب وملف المتبرع. يمكنك تسجيل الدخول الآن.');setTimeout(()=>location.href='login.html',700)}}catch(err){showMessage(err.message,true)}})</script></body></html>
