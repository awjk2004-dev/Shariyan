<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متصدرو العطاء | شريان</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/leaderboard.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="index.html">شريان<span>.</span></a><nav class="nav"><a href="donors.html">المتبرعون</a><a href="requests.html">طلبات الدم</a></nav></header><main class="section"><div class="section-heading"><div><div class="eyebrow">قائمة الشكر</div><h1>متصدرو العطاء</h1><p class="muted">ترتيب المتبرعين المتاحين حسب الجاهزية وتحديث بيانات التبرع.</p></div></div><div class="notice">النقاط تقدّر الجاهزية الحالية وليست عدداً نهائياً لعمليات التبرع.</div><div class="leaderboard" id="leaderboard"><p class="muted">جاري تحميل القائمة...</p></div></main></div><script src="js/app.js"></script><script>const demoLeaders=['أحمد محمد علي','صالح المرغني','نبيل مكرم','عمر بانت','خالد سكة حديد','فهد عبد الله','مصطفى حسن','ياسر آدم','طارق عثمان','سامر النور'].map((name,index)=>({rank:index+1,score:100-index*3,blood_type:['O+','A-','B+','AB+','O-','A+','B-','AB-','O+','B+'][index],user:{full_name:name,city:['المربعات الشعبي','المرغني','مكرم','حي العرب','سكة حديد','حي العمال','حي النور','حي السلام','حي الضباط','كسلا'][index]}}));function renderLeaders(rows,isDemo=false){leaderboard.innerHTML=`${isDemo?'<div class="notice">بيانات تجريبية للعرض فقط. شغّل قاعدة البيانات لعرض البيانات الفعلية.</div>':''}${rows.map(r=>`<article class="leader-row"><div class="rank">${r.rank}</div><div class="leader-main"><h3>${r.user.full_name}</h3><p class="muted">${r.user.city} · فصيلة ${r.blood_type}</p></div><strong>${r.score} نقطة</strong></article>`).join('')}`}api('/donors/leaderboard').then(rows=>rows.length?renderLeaders(rows):renderLeaders(demoLeaders,true)).catch(()=>renderLeaders(demoLeaders,true))</script></body></html>
