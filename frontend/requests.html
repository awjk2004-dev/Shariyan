<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات الدم | شريان</title><link rel="stylesheet" href="css/style.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="index.html">شريان<span>.</span></a><nav class="nav" data-nav><a href="donors.html">المتبرعون</a><a href="login.html">دخول</a></nav></header><main class="section"><div class="section-heading"><div><div class="eyebrow">نداءات مفتوحة</div><h1>طلبات الدم في ولاية كسلا</h1></div><a class="button" href="new-request.html">أنشئ طلبًا</a></div><div class="grid" id="list"></div></main></div><script src="js/app.js"></script><script>api('/requests').then(rows=>{const localRows = rows.filter(r => String(r.city).includes('كسلا') || String(r.city).includes('المربعات') || String(r.city).includes('المرغني') || String(r.city).includes('مكرم') || String(r.city).includes('حي') || String(r.city).includes('سكة') || String(r.city).includes('العمال')); list.innerHTML = (localRows.length ? localRows : rows).length ? (localRows.length ? localRows : rows).map(r=>`<article class="card"><div class="eyebrow">${r.urgent?'عاجل · ':''}فصيلة ${r.blood_type}</div><h3>${r.patient_name}</h3><p>${r.hospital}</p><p class="muted">${r.city} · ${r.units} وحدة</p></article>`).join(''):'<p class="muted">لا توجد طلبات مفتوحة حاليًا في ولاية كسلا.</p>'}).catch(()=>list.innerHTML='<p class="muted">شغّل الخادم لعرض الطلبات.</p>')</script></body></html>
