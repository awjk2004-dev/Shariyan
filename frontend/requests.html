<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>طلبات الدم | شريان</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="index.html">شريان<span>.</span></a>
        <nav class="nav" data-nav>
          <a href="donors.html">المتبرعون</a>
          <a href="login.html">دخول</a>
        </nav>
      </header>
      <main class="section">
        <div class="section-heading">
          <div>
            <div class="eyebrow">نداءات مفتوحة</div>
            <h1>طلبات الدم في ولاية كسلا</h1>
          </div>
          <a class="button" href="new-request.html">أنشئ طلبًا</a>
        </div>
        <div class="grid" id="list"></div>
      </main>
    </div>
    <script src="js/config.js?v=deployment-20261117"></script>
    <script src="js/app.js?v=brand-20261117-v2"></script>
    <script>
      api("/requests")
        .then((rows) => {
          const localRows = rows.filter((request) =>
            ["كسلا", "المربعات", "المرغني", "مكرم", "حي", "سكة", "العمال"].some(
              (area) => String(request.city).includes(area),
            ),
          );
          const visibleRows = localRows.length ? localRows : rows;
          document.querySelector("#list").innerHTML = visibleRows.length
            ? visibleRows
                .map((request) => {
                  const contact = request.contact_phone
                    ? `<p><a class="button secondary" href="tel:${encodeURIComponent(request.contact_phone)}">اتصل بصاحب الطلب: ${escapeHTML(request.contact_phone)}</a></p>`
                    : '<p class="muted">لا يوجد رقم تواصل مضاف.</p>';
                  return `<article class="card"><div class="eyebrow">${request.urgent ? "عاجل · " : ""}فصيلة ${escapeHTML(request.blood_type)}</div><h3>طلب تبرع بالدم</h3><p>${escapeHTML(request.hospital)}</p><p class="muted">${escapeHTML(request.city)} · ${request.units} وحدة</p>${contact}</article>`;
                })
                .join("")
            : '<p class="muted">لا توجد طلبات مفتوحة حاليًا في ولاية كسلا.</p>';
        })
        .catch(() => {
          document.querySelector("#list").innerHTML =
            '<p class="muted">شغّل الخادم لعرض الطلبات.</p>';
        });
    </script>
  </body>
</html>
